version: "3.7"
services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: laravel-app
        restart: always
        working_dir: /var/www/
        volumes:
            - ../../:/var/www
        networks:
            - laravel

    nginx:
        restart: always
        image: nginx
        ports:
            - 3000:80
        volumes:
            - ../../:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/app.conf
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
